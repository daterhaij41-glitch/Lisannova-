name: Extract LisanNova Project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          if [ ! -f "LisanNova-Android-Source.zip" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi
          unzip -o "LisanNova-Android-Source.zip" -d .

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract LisanNova Android project"
            git push
          fi
